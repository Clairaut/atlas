[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.5.2"
description = "A SwissEph interface for visualizing astrological/astronomical data."
authors = [{ name = "clairaut" }]
requires-python = ">=3.9"
dependencies = [
    "pyswisseph",
    "fastapi",
    "uvicorn",
    "rich",
    "typer>=0.12",
    "timezonefinder",
    "pytz",
    "moderngl",
    "moderngl-window",
    "Pillow",
    "numpy",
    "glfw",
]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atlas = ["view/shaders/*.vert", "view/shaders/*.frag", "data/*.dat", "data/*.npy"]
